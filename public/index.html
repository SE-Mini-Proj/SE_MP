<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App - WebSocket Test Client</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .chat-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    header {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background-color: var(--border-color);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
    }
    .status-dot.online {
      background-color: var(--success);
    }
    .room-bar {
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }
    .room-bar input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .room-bar button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .messages-area {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      max-width: 80%;
      font-size: 0.95rem;
      line-height: 1.4;
      background: #334155;
      align-self: flex-start;
    }
    .message.own {
      background: var(--primary);
      align-self: flex-end;
    }
    .message .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .message.own .meta {
      color: rgba(255, 255, 255, 0.8);
    }
    .typing-notice {
      padding: 0.25rem 1rem;
      font-size: 0.8rem;
      font-style: italic;
      color: var(--text-muted);
      min-height: 1.5rem;
    }
    footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }
    footer input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    footer button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    footer button:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <h3>Socket Chat Test Client</h3>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </header>

    <div class="room-bar">
      <input type="text" id="roomInput" placeholder="Room ID (e.g. general)" value="general" />
      <button id="joinBtn">Join Room</button>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="message">
        <div class="meta">System • Now</div>
        Welcome to the Real-Time Socket Chat test console.
      </div>
    </div>

    <div class="typing-notice" id="typingNotice"></div>

    <footer>
      <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const messagesArea = document.getElementById('messagesArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const typingNotice = document.getElementById('typingNotice');

    let currentRoom = 'general';
    let typingTimeout = null;

    socket.on('connect', () => {
      statusDot.classList.add('online');
      statusText.textContent = `Online (${socket.id.substring(0, 5)})`;
      socket.emit('room:join', { roomId: currentRoom });
    });

    socket.on('disconnect', () => {
      statusDot.classList.remove('online');
      statusText.textContent = 'Disconnected';
    });

    socket.on('message:receive', (msg) => {
      addMessage(msg.senderId, msg.text, msg.senderId === socket.id, msg.timestamp);
    });

    socket.on('typing:update', ({ userId, isTyping, roomId }) => {
      if (isTyping) {
        typingNotice.textContent = `${userId} is typing...`;
      } else {
        typingNotice.textContent = '';
      }
    });

    function addMessage(sender, text, isOwn, time) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isOwn ? 'own' : ''}`;
      const timeStr = time ? new Date(time).toLocaleTimeString() : 'Now';
      msgDiv.innerHTML = `<div class="meta">${escapeHtml(sender)} • ${timeStr}</div>${escapeHtml(text)}`;
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function escapeHtml(str) {
      const p = document.createElement('p');
      p.appendChild(document.createTextNode(str));
      return p.innerHTML;
    }

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('message:send', {
        roomId: currentRoom,
        text,
        clientMsgId: crypto.randomUUID ? crypto.randomUUID() : 'id_' + Date.now()
      });
      socket.emit('typing:stop', { roomId: currentRoom });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      } else {
        socket.emit('typing:start', { roomId: currentRoom });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit('typing:stop', { roomId: currentRoom });
        }, 1500);
      }
    });

    joinBtn.addEventListener('click', () => {
      const newRoom = roomInput.value.trim();
      if (newRoom && newRoom !== currentRoom) {
        socket.emit('room:leave', { roomId: currentRoom });
        currentRoom = newRoom;
        socket.emit('room:join', { roomId: currentRoom });
        addMessage('System', `Joined room: ${currentRoom}`, false);
      }
    });
  </script>
</body>
</html>
